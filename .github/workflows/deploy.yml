name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Strona działa bezpośrednio pod domeną główną:
          # https://jjmultiservice.pl/
          BASE_PATH: /

          # Konfiguracja formularza
          VITE_FORM_PROVIDER: ${{ vars.VITE_FORM_PROVIDER }}
          VITE_FORMSUBMIT_TARGET: ${{ vars.VITE_FORMSUBMIT_TARGET }}

          # Hasło panelu /admin jako SHA-256
          VITE_ADMIN_PASS_HASH: ${{ vars.VITE_ADMIN_PASS_HASH }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
